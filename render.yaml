services:
  - type: web
    name: hair-vto-enterprise
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.16
      - key: VTO_SECRET_KEY
        generateValue: true
